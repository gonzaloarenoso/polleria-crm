function mesAnterior(){
  const d=new Date(hoy()+"T12:00:00"); d.setDate(1); d.setMonth(d.getMonth()-1);

function equilibrio(){
  if(datos.equilibrioManual) return {diario:datos.equilibrioManual, manual:true};
  const m=mesAnterior();
  const dm=cierresCalc().filter(c=>ym(c.fecha)===m);
  if(dm.length<20) return {diario:null, falta:"Hacen falta al menos 20 días cargados de "+nombreMes(m)+" y hay "+dm.length+"."};
  const ventas=dm.reduce((a,c)=>a+c.efectivo+c.posnet,0);
  const dias=dm.length;

  const compras=datos.pedidos.filter(x=>ym(x.fecha)===m).reduce((a,x)=>a+x.monto,0);
  const mc=1-compras/ventas;
  if(mc<=0.15||mc>=0.85) return {diario:null, falta:"El margen dio "+(mc*100).toFixed(0)+"%. Faltan cargar pedidos o hay ventas sin cargar."};

  const sueldos=datos.empleados.filter(e=>e.activo).reduce((a,e)=>a+e.sueldo+e.viaticos,0);
  const csCargadas=datos.gastos.filter(g=>g.categoria==="Cargas sociales"&&ym(g.fecha)===m).reduce((a,g)=>a+g.monto,0);
  const cs=csCargadas>0?csCargadas:sueldos*0.54;
  const otrosFijos=datos.gastos.filter(g=>ym(g.fecha)===m&&CAT_FIJAS.indexOf(g.categoria)>=0&&g.categoria!=="Cargas sociales")
    .reduce((a,g)=>a+g.monto,0);
  const chicos=dm.reduce((a,c)=>a+Math.max(0,c.gastosChicos||0),0);
  if(chicos/ventas>0.08) return {diario:null,
    falta:"Los gastos chicos de "+nombreMes(m)+" dan "+$$(chicos)+", el "+(chicos/ventas*100).toFixed(0)+"% de la venta. Son demasiados: casi seguro faltan cargar retiros del cajón."};
  const fijos=sueldos+cs+otrosFijos+chicos*(30/dias);
  const mensual=fijos/mc;
  return {diario:mensual/30, mensual, fijos, mc, sueldos, cs, csEst:csCargadas<=0,
          otrosFijos, chicos:chicos*(30/dias), ventas, compras, dias, mes:m};
}

function calcular(d){
  const cs=[...d.cierres].sort((a,b)=>a.fecha<b.fecha?-1:1);
  const conB=cs.filter(c=>c.banco!==null&&c.banco!==undefined);
  const conQ=cs.filter(c=>c.quedo!==null&&c.quedo!==undefined);
  const uB=conB[conB.length-1], uQ=conQ[conQ.length-1];
  const corte=uB?uB.fecha:d.inicio.fecha;
  let cajaChica=uQ?uQ.quedo:d.inicio.cajaChica, banco=uB?uB.banco:d.inicio.banco, cajaGrande=d.inicio.cajaGrande;
  (d.retiros||[]).forEach(r=>cajaGrande+=r.monto||0);
  let bancoEst=false;
  cs.forEach(c=>{ if(c.fecha>corte){ banco+=c.posnet||0; bancoEst=true; } });
  d.gastos.forEach(g=>{ if(g.origen==="efectivo") cajaGrande-=g.monto; else if(g.fecha>corte) banco-=g.monto; });
  d.liquidaciones.forEach(l=>{ const g=pagoLiq(l); cajaGrande-=g.efe; if(l.fecha>corte) banco-=g.ban; });
  d.pedidos.forEach(x=>{
    if(!x.pagado) return;
    const g=pagoDe(x);
    cajaGrande-=g.efe;
    if(x.fecha>corte) banco-=g.ban;
  });
  d.consumos.forEach(c=>{ if(c.tipo!=="adelanto") return; if(c.origen==="efectivo") cajaGrande-=c.monto; else if(c.fecha>corte) banco-=c.monto; });
  d.traspasos.forEach(t=>{ const n=t.monto-(t.comision||0);
    if(t.sentido==="be"){ cajaGrande+=n; if(t.fecha>corte) banco-=t.monto; }
    else { cajaGrande-=t.monto; if(t.fecha>corte) banco+=n; } });
  return { cajaChica, cajaGrande, banco, bancoEst, total:cajaGrande+banco };
}
function previos(f){
  const a=datos.cierres.filter(c=>c.fecha<f).sort((x,y)=>x.fecha<y.fecha?-1:1);
  const qs=a.filter(c=>c.quedo!==null&&c.quedo!==undefined), bs=a.filter(c=>c.banco!==null&&c.banco!==undefined);
  const uq=qs[qs.length-1], ub=bs[bs.length-1];

          corte:ub?ub.fecha:datos.inicio.fecha, sinQuedo:!!(a.length&&a[a.length-1].quedo==null)};
}

function completar(d){
  ["cierres","gastos","traspasos","consumos","liquidaciones","pedidos","empleados"].forEach(k=>{ if(!d[k]) d[k]=[]; });
  if(!d.proveedores||!d.proveedores.length) d.proveedores=[{id:"pr1",nombre:"Pollo"},{id:"pr2",nombre:"Congelados"}];
  if(!d.retiros) d.retiros=[];
  if(!d.inventarios) d.inventarios=[];
  if(!d.migRetiros){
    (d.cierres||[]).forEach(c=>{ if(c.retiro>0) d.retiros.push({id:uid8(),fecha:c.fecha,monto:c.retiro,deCierre:true}); });
    d.migRetiros=true;
  }
  if(!d.ventas) d.ventas=[];
  d.ventas = d.ventas.map(v=>{
    if(v.desde&&v.hasta) return v;
    const h=v.fecha, dd=new Date(h+"T12:00:00"); dd.setDate(dd.getDate()-6);
    const de=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    return {...v,desde:de,hasta:h};
  });
  if(!d.productos||!d.productos.length) d.productos=JSON.parse(JSON.stringify(PRODUCTOS_BASE));
  d.productos = d.productos.map(x=> x.tipo ? x : {...x,tipo:"congelado"});
  d.productos = d.productos.map(x=>{
    if(x.prov!==undefined) return x;
    const n=x.n.toLowerCase();
    let prov = x.tipo==="propio" ? "ave" : "congelados";
    if(/burger de (espinaca|lenteja|remolacha|zapallo|garbanzo|qu[ií]noa)/.test(n)) prov="veggie";
    return {...x,prov};
  });
  d.productos = d.productos.map(x=>{
    if(x.fam!==undefined) return x;
    const n=x.n.toLowerCase();
    let fam=null, fac=0;
    if(/burger|medall|albondig/.test(n) && x.tipo==="propio"){ fam="mezcla"; fac=x.u==="kg"?0.9:0; }
    else if(/crunch/.test(n)){ fam="pechuga"; fac=0.75; }
    else if(/milanesa.*pechuga|milanes.*pechuga/.test(n)){ fam="pechuga"; fac=0.70; }
    else if(/milanesa.*(pata|muslo)/.test(n)){ fam="patamuslo"; fac=0.70; }
    else if(/^pechuga/.test(n)){ fam="pechuga"; fac=1.00; }
    else if(/pata y muslo|patamuslo/.test(n)){ fam="patamuslo"; fac=1.00; }
    return {...x,fam,fac};
  });
  if(!d.conteos) d.conteos=[];
  if(!d.kgCajon) d.kgCajon=KG_CAJON_DEF;
  if(!d.inicio) d.inicio=INICIAL.inicio;
  d.gastos = d.gastos.map(g=> g.categoria==="Retiro del dueño" ? {...g,categoria:CAT_RETIRO} : g);
  return d;
}
function cierresCalc(){
  const cs=[...datos.cierres].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let prevQ=datos.inicio.cajaChica;
  return cs.map(c=>{
    const ret=(datos.retiros||[]).filter(r=>r.fecha===c.fecha).reduce((a,r)=>a+r.monto,0);
    const chicos=(c.quedo==null)?null:prevQ+c.efectivo-ret-c.quedo;
    const falt=(chicos==null)?null:chicos-(c.gastosConocidos||0);
    if(c.quedo!=null) prevQ=c.quedo;
    return {...c, retiro:ret, gastosChicos:chicos, faltante:falt};
  });
}

function pagoLiq(l){

  } catch(e) {
    try { await db.enablePersistence(); } catch(e2) { /* sin guardado local: la app funciona igual con conexión */ }
  }
  window.addEventListener("online", pintarConexion);
  window.addEventListener("offline", pintarConexion);
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){ uid=null; datos=null; render(); return; }
    uid = u.uid;
    db.collection("caja").doc(uid).onSnapshot(doc=>{
      datos = completar(doc.exists ? doc.data() : JSON.parse(JSON.stringify(INICIAL)));
      if(!doc.exists) db.collection("caja").doc(uid).set(datos);
      render();
    }, err=>{ notificar("Error de conexión: "+err.message); });

}
function cargarSDK(){
  const urls=["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
              "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js",
              "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"];
  return urls.reduce((p,u)=>p.then(()=>new Promise((res,rej)=>{
    const s=document.createElement("script"); s.crossOrigin="anonymous"; s.src=u; s.onload=res; s.onerror=()=>rej(new Error("No se pudo cargar Firebase")); document.head.appendChild(s);
  })), Promise.resolve());
}

  try { await firebase.auth().sendPasswordResetEmail(e); notificar("Te mandamos un mail para cambiar la clave."); }
  catch(err){ notificar(traducir(err.code)); }
}
async function entrar(){
  const e=aMail(val("mail")), p=val("pass");
  if(!val("mail").trim()) return notificar("Escribí tu usuario o mail.");
  if(!p) return notificar("Falta la clave.");

async function crearCuenta(){
  const bruto=val("mail").trim(), e=aMail(bruto), p=val("pass");

  if(!/^\d{6,}$/.test(p)) return notificar("La clave tiene que ser de 6 números o más.");
  try { await firebase.auth().createUserWithEmailAndPassword(e,p); }
  catch(err){ notificar(traducir(err.code)); }
}

  "auth/user-not-found":"No existe ese usuario.","auth/email-already-in-use":"Ese usuario ya existe. Usá Entrar.",

  "auth/network-request-failed":"Sin conexión.",

    liquidar:vLiquidar,nuevoEmp:vNuevoEmp,movs:vMovs,retiro:vRetiro,pedido:vPedido,semana:vSemana,productos:vProductos,inventario:vInventario,resultado:vResultado,familias:vFamilias,control:vControl,historialCarne:vHistorialCarne,hub:vHub,reposicion:vReposicion,informe:vInforme,ajustes:vAjustes})[panel.tipo]();

function vInicio(){
  const s=calcular(datos), m=ym(hoy());
  const hoyD=new Date(hoy()+"T12:00:00");
  const ultimo=new Date(hoyD.getFullYear(),hoyD.getMonth()+1,0).getDate();
  const faltan=ultimo-hoyD.getDate();
  const avisoInv = (faltan<=1 && !datos.inventarios.some(x=>x.mes===m))
    ? '<div class="recordatorio"><p style="font-weight:500;margin-bottom:4px">Contá el inventario</p>'+
      '<p class="tiny" style="margin-bottom:10px">'+(faltan===0?"Hoy es el último día del mes.":"Mañana cierra el mes.")+
      ' Sin el conteo no se puede calcular la ganancia.</p>'+
      '<button class="btn2" onclick="abrir(\'inventario\')">Cargar inventario</button></div>'
    : "";
  const dm=cierresCalc().filter(c=>ym(c.fecha)===m);
  const ventas=dm.reduce((a,c)=>a+c.efectivo+c.posnet,0);
  const prom=dm.length?ventas/dm.length:0;
  const chicos=dm.reduce((a,c)=>a+Math.max(0,c.gastosChicos||0),0);
  const falt=dm.reduce((a,c)=>a+(c.faltante||0),0);
  const cli=dm.reduce((a,c)=>a+(c.clientes||0),0);
  const delMesG=datos.gastos.filter(g=>ym(g.fecha)===m);
  const delMesL=datos.liquidaciones.filter(l=>ym(l.fecha)===m);
  const delMesA=datos.consumos.filter(c=>c.tipo==="adelanto"&&ym(c.fecha)===m);
  const sum=(arr,campo,orig)=>arr.filter(x=>x.origen===orig).reduce((a,x)=>a+x[campo],0);
  const gOper=delMesG.filter(g=>g.categoria!==CAT_RETIRO&&g.categoria!==CAT_ESPECIE);
  const gRet=delMesG.filter(g=>g.categoria===CAT_RETIRO);
  const gEsp=delMesG.filter(g=>g.categoria===CAT_ESPECIE);
  const pedPag=datos.pedidos.filter(x=>x.pagado&&ym(x.fecha)===m);
  const efe = sum(gOper,"monto","efectivo") + delMesL.reduce((a,l)=>a+pagoLiq(l).efe,0) + sum(delMesA,"monto","efectivo") + pedPag.reduce((a,x)=>a+pagoDe(x).efe,0);
  const ban = sum(gOper,"monto","banco") + delMesL.reduce((a,l)=>a+pagoLiq(l).ban,0) + sum(delMesA,"monto","banco") + pedPag.reduce((a,x)=>a+pagoDe(x).ban,0);
  const ret = gRet.reduce((a,g)=>a+g.monto,0);
  const esp = gEsp.reduce((a,g)=>a+g.monto,0);
  const deuda = deudaTotal();
  const cargado=datos.cierres.some(c=>c.fecha===hoy());
  const act=datos.empleados.filter(e=>e.activo);

  const recientes=[
    ...datos.gastos.map(g=>({...g,k:"gastos",t:g.categoria+(g.nota?" · "+g.nota:""),s:g.origen==="efectivo"?"efectivo":"banco"})),
    ...datos.traspasos.map(t=>({...t,k:"traspasos",t:t.sentido==="be"?"Banco a efectivo":"Efectivo a banco",s:t.comision?"comisión "+$$(t.comision):"sin comisión"})),
    ...datos.consumos.filter(c=>c.tipo==="adelanto").map(c=>({...c,k:"consumos",t:"Adelanto",s:(datos.empleados.find(e=>e.id===c.empleadoId)||{}).nombre||""}))
  ].sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,6);

  let h=avisoInv+'<div class="card"><div class="total"><span class="muted">Disponible</span>'+
    '<span style="display:flex;align-items:center;gap:10px"><b>'+oc(s.total)+'</b>'+
    '<button class="ojo" onclick="verMontos=!verMontos;render()">'+(verMontos?OJO_ON:OJO_OFF)+'</button></span></div>'+
    '<div class="row">'+
    '<div class="mini"><p>Efectivo</p><p>'+oc(s.cajaGrande)+'</p></div>'+
    '<div class="mini"><p>Banco'+(s.bancoEst?' (estimado)':'')+'</p><p>'+oc(s.banco)+'</p></div></div>'+
    (deuda>0 ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #f5f5f4">'+
      fila("Deuda con proveedores","−"+oc(deuda))+
      fila("Queda libre",oc(s.total-deuda),true)+'</div>' : "")+
    '</div>';

  h+='<button class="big'+(cargado?" hecho":"")+'" onclick="abrir(\'cierre\')">'+(cargado?"&#10003; Día cargado · editar":"Cerrar el día")+'</button>';
  h+='<div class="acciones4"><button class="acc" onclick="abrir(\'gasto\')">Gasto</button>'+
     '<button class="acc" onclick="abrir(\'pedido\')">Pedido</button>'+
     '<button class="acc" onclick="abrir(\'retiro\')">Retiro</button>'+
     '<button class="acc" onclick="abrir(\'traspaso\')">Traspaso</button>'+
     '<button class="acc" onclick="abrir(\'empMov\')">Empleado</button>'+
     '<button class="acc" onclick="abrir(\'hub\')">Más</button></div>';

  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">'+
     '<h3>'+esc(nombreMes(m))+'</h3><button class="link" onclick="abrir(\'ajustes\')">Historial y ajustes</button></div><div class="resumen">'+
     fila("Ventas · "+dm.length+(dm.length===1?" día":" días"),oc(ventas),true)+
     fila("Promedio diario",oc(prom))+
     (cli?fila("Ticket promedio · "+fmt(cli)+" clientes",oc(ventas/cli)):"")+
     fila("Gastos en efectivo",oc(efe))+
     fila("Gastos de cuenta bancaria",oc(ban))+
     fila("Salió del cajón",oc(chicos))+
     (falt?fila("Faltantes del mes",oc(falt)):"")+
     (ret?fila("Retiros de socios",oc(ret)):"")+
     (esp?fila("Retiros en especie",oc(esp)):"")+'</div>';
  const eq=equilibrio();
  if(dm.length && verMontos){
    if(eq.diario) h+='<p style="margin-top:12px;font-size:14px;color:'+(prom>=eq.diario?"#15803d":"#b91c1c")+'">'+
      (prom>=eq.diario ? $$(prom-eq.diario)+" por día por encima del equilibrio."
                       : "Faltan "+$$(eq.diario-prom)+" por día para el equilibrio.")+
      '<br><span class="tiny">Equilibrio: '+$$(eq.diario)+' por día'+(eq.manual?" (puesto a mano)":", calculado con "+nombreMes(eq.mes))+'</span></p>';
    else h+='<p class="tiny" style="margin-top:12px">Equilibrio no calculable: '+esc(eq.falta)+'</p>';
  }
  h+='</div>';

  const provs=datos.proveedores;
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">'+
    '<h3>Deuda con proveedores</h3><button class="link" onclick="abrir(\'pedido\')">Registrar pedido</button></div><div class="resumen">'+
    provs.map(pr=>fila(pr.nombre,oc(deudaProv(pr)))).join("")+
    fila("Total",oc(deuda),true)+'</div>'+
    (deuda===0?'<p class="tiny" style="margin-top:8px">Si ya le debías algo antes de empezar, cargalo en Historial y ajustes.</p>':'')+
    '</div>';

  h+='<div class="card"><button class="desplegar" onclick="verEmpleados=!verEmpleados;render()">'+
     '<h3>Empleados</h3><span class="flecha">'+act.length+' '+(verEmpleados?'&#9650;':'&#9660;')+'</span></button>';
  if(verEmpleados){
    h+='<div style="margin-top:8px">';
    h+= act.length ? act.map(e=>'<button class="emp" onclick="verEmpleado(\''+e.id+'\')"><span style="font-size:14px">'+esc(e.nombre)+
       '</span><span class="s"><p>'+$$(saldoEmp(e.id))+'</p><p class="tiny">a descontar</p></span></button>').join("")
       : '<p class="muted">No hay empleados cargados.</p>';
    h+='<p style="margin-top:10px"><button class="link" onclick="abrir(\'nuevoEmp\')">Agregar empleado</button></p></div>';
  }
  h+='</div>';

  if(recientes.length){
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
      '<h3>Últimos movimientos</h3><button class="link" onclick="abrir(\'movs\')">Ver todos y editar</button></div>'+
      recientes.map(r=>'<div class="item"><div class="txt"><p>'+esc(r.t)+'</p><p class="tiny">'+fec(r.fecha)+' · '+esc(r.s)+
      '</p></div><div class="der"><span>'+$$(r.monto)+'</span><button class="del" onclick="borrarMov(\''+r.k+'\',\''+r.id+'\')">Borrar</button></div></div>').join("")+'</div>';
  }
  if(!NUBE) h+='<p class="tiny" style="text-align:center">Guardando solo en este dispositivo. Pegá la configuración de Firebase para sincronizar.</p>';
  else h+='<p style="text-align:center"><button class="link" onclick="salir()">Cerrar sesión</button></p>';
  return h;
}

const fila=(l,v,f)=>'<div class="fila'+(f?" fuerte":"")+'"><span>'+esc(l)+'</span><span>'+v+'</span></div>';

function irA(p){ if(panel) pila.push(panel); if(pila.length>15) pila.shift(); panel=p; render(); window.scrollTo(0,0); }

function borrarMov(k,id){ const n={...datos}; n[k]=datos[k].filter(x=>x.id!==id); guardar(n); }

   '</div><button class="link" style="margin-top:4px" onclick="irA({tipo:\'retiro\',fecha:\''+f+'\'};render()">Cargar un retiro</button></label>'+
   '<label><span>Quedó en caja</span><input id="cq" inputmode="decimal" value="'+v("quedo")+'" oninput="recalcCierre()"></label></div>'+
   '<div class="row"><label><span>Clientes (tickets del CRM)</span><input id="ck" inputmode="numeric" placeholder="0" value="'+v("clientes")+'" oninput="recalcCierre()"></label><label></label></div>'+
   '<div class="mb"><label><span>De lo que salió del cajón, gastos conocidos</span><input id="cg" inputmode="decimal" placeholder="0" value="'+v("gastosConocidos")+'" oninput="recalcCierre()"></label></div>'+
   '<div class="mb"><label><span>Saldo real del banco</span><input id="cb" inputmode="decimal" value="'+v("banco")+'" oninput="recalcCierre()"></label></div>'+
   '<div class="resumen" id="resCierre"></div><p id="errCierre"></p></div>'+
   '<button class="btn" onclick="guardarCierre()">'+(e?"Actualizar día":"Guardar día")+'</button>';
}
function movBanco(f){
  let m=0;
  datos.gastos.forEach(g=>{ if(g.origen==="banco"&&g.fecha===f) m-=g.monto; });
  datos.liquidaciones.forEach(l=>{ if(l.fecha===f) m-=pagoLiq(l).ban; });
  datos.consumos.forEach(c=>{ if(c.tipo==="adelanto"&&c.origen==="banco"&&c.fecha===f) m-=c.monto; });
  datos.pedidos.forEach(x=>{ if(x.pagado&&x.fecha===f) m-=pagoDe(x).ban; });
  datos.traspasos.forEach(t=>{ if(t.fecha!==f) return; m += t.sentido==="be" ? -t.monto : t.monto-(t.comision||0); });
  return m;
}
function datosCierre(){
  const f=panel.fecha, p=previos(f);
  const e=num(val("ce")), po=num(val("cp")), r=retirosDe(f);
  const hayQ=val("cq")!=="", hayB=val("cb")!=="";
  const q=hayQ?num(val("cq")):null, b=hayB?num(val("cb")):null;
  const chicos=hayQ?p.cajaChica+e-r-q:null, esperado=p.banco+po+movBanco(f);
  const conocidos=num(val("cg")), faltante=chicos===null?null:chicos-conocidos, clientes=cant(val("ck"));
  return {f,e,po,r,q,b,chicos,conocidos,faltante,clientes,dif:b===null?null:b-esperado};
}
function recalcCierre(){
  try{ recalcCierre_(); }catch(e){}
}
function recalcCierre_(){
  const d=datosCierre();
  document.getElementById("resCierre").innerHTML =
    fila("Venta del día",$$(d.e+d.po),true)+
    (d.clientes?fila("Ticket promedio",$$((d.e+d.po)/d.clientes)+" · "+fmt(d.clientes)+" clientes"):"")+
    (d.chicos===null?fila("Salió del cajón","sin conteo"):fila("Salió del cajón",$$(d.chicos)))+
    (d.conocidos&&d.chicos!==null?fila("Gastos conocidos",$$(d.conocidos)):"")+
    (d.conocidos&&d.chicos!==null?fila(d.faltante>=0?"Faltante":"Sobrante",$$(Math.abs(d.faltante)),true):"")+
    (d.dif===null?fila("Banco","sin saldo cargado"):fila("Sin acreditar o comisiones",$$(d.dif)));
  document.getElementById("errCierre").innerHTML =
    (d.chicos!==null&&d.chicos<0) ? '<span class="error">Los gastos chicos dan negativo. Revisá el conteo o el retiro.</span>' : "";
}
function guardarCierre(){
  if(val("ce")==="") return notificar("Falta el efectivo cobrado.");
  const d=datosCierre();
  const reg={fecha:d.f,efectivo:d.e,posnet:d.po,retiro:retirosDe(d.f),quedo:d.q,banco:d.b,gastosChicos:d.chicos,clientes:d.clientes,gastosConocidos:d.conocidos,faltante:d.conocidos?d.faltante:0,difBanco:d.dif};
  const existia=datos.cierres.some(c=>c.fecha===d.f);
  guardar({...datos,cierres:[...datos.cierres.filter(c=>c.fecha!==d.f),reg]});
  listo(existia?"Día actualizado.":"Día guardado.");
}

function guardarGasto(){
  const m=num(val("gm"));
  if(m<=0) return notificar("Poné el importe.");
  const reg={id:panel.edit||uid8(),fecha:val("gf"),categoria:val("gc"),monto:m,origen:val("go"),nota:val("gn")};

  guardar({...datos,gastos:lista});

  ["gm","gn"].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=""; });
  render(); sigo("Gasto registrado. Podés cargar otro.");

function recalcTraspaso(){
  try{ recalcTraspaso_(); }catch(e){}
}
function recalcTraspaso_(){
  const con=document.getElementById("tk").checked;
  document.getElementById("tcom").style.display = con ? "block" : "none";
  const m=num(val("tm")), c=con?num(val("tc")):0, be=val("ts")==="be";
  document.getElementById("resTras").innerHTML =
    fila(be?"Sale del banco":"Sale del efectivo",$$(m))+fila(be?"Entra en el efectivo":"Entra en el banco",$$(m-c),true);
}
function guardarTraspaso(){
  const m=num(val("tm")), con=document.getElementById("tk").checked, c=con?num(val("tc")):0;
  if(m<=0) return notificar("Poné el importe.");
  if(c>=m) return notificar("La comisión no puede ser mayor al importe.");
  const reg={id:panel.edit||uid8(),fecha:val("tf"),sentido:val("ts"),monto:m,comision:c};

/* ---------- liquidación ---------- */
function vLiquidar(){
  const e=panel.emp;
  const pend=datos.consumos.filter(c=>c.empleadoId===e.id&&!c.liquidado);
  const brutoIni = panel.ls!==undefined ? panel.ls : (e.sueldo+e.viaticos);
  const deudaIni=pend.reduce((a,c)=>a+c.monto,0);
  const netoIni=Math.max(0,brutoIni-Math.min(deudaIni,brutoIni));
  return '<div class="card"><p style="font-weight:500;margin-bottom:12px">'+esc(e.nombre)+'</p>'+
   '<div class="mb"><label><span>Sueldo a pagar</span><input id="ls" inputmode="decimal" value="'+brutoIni+'" oninput="panel.ls=this.value;recalcLiquidar()"></label></div>'+
   '<div class="resumen mb"><p class="tiny" style="margin-bottom:6px">Consumos y adelantos pendientes</p>'+
   (pend.length ? pend.map(c=>'<div class="fila"><span>'+esc(etiqueta(c))+'</span><span>'+$$(c.monto)+'</span></div>').join("") : '<p class="muted">Ninguno.</p>')+'</div>'+
   '<div class="row"><label><span>Pago en efectivo</span><input id="lpe" inputmode="decimal" placeholder="0" value="'+(panel.lpe!==undefined?panel.lpe:netoIni)+'" oninput="panel.lpe=this.value;recalcLiquidar()"></label>'+
   '<label><span>Pago por banco</span><input id="lpb" inputmode="decimal" placeholder="0" value="'+(panel.lpb!==undefined?panel.lpb:"")+'" oninput="panel.lpb=this.value;recalcLiquidar()"></label></div>'+
   '<div class="resumen" id="resLiq"></div></div>'+
   '<button class="btn" onclick="guardarLiquidacion()">Liquidar sueldo</button>';
}
function recalcLiquidar(){
  try{ recalcLiquidar_(); }catch(e){}
}
function recalcLiquidar_(){
  const e=panel.emp;
  const deuda=saldoEmp(e.id), bruto=num(val("ls")), ap=Math.min(deuda,bruto);
  const pe=num(val("lpe")), pb=num(val("lpb"));
  const brutoReal=pe+pb+ap;
  const difiere=Math.abs(brutoReal-bruto)>1;
  document.getElementById("resLiq").innerHTML =
    fila("Le descontás",$$(ap))+
    (pe?fila("Le pagás en efectivo",$$(pe)):"")+
    (pb?fila("Le pagás por banco",$$(pb)):"")+
    fila("Costo salarial que se registra",$$(brutoReal),true)+
    (difiere?'<p class="tiny" style="margin-top:6px">Arriba pusiste '+$$(bruto)+'. Se va a guardar '+$$(brutoReal)+', que es lo que realmente pagás más lo que le descontás.</p>':"")+
    (deuda>bruto?'<p class="tiny" style="margin-top:6px">Quedan '+$$(deuda-brutoReal>0?deuda-brutoReal:0)+' pendientes para la próxima.</p>':"");
}
function guardarLiquidacion(){
  const e=panel.emp, puesto=num(val("ls"));
  const pe=num(val("lpe")), pb=num(val("lpb"));
  if(pe+pb<=0) return notificar("Poné cuánto le pagaste en efectivo o por banco.");
  const deuda=saldoEmp(e.id), ap=Math.min(deuda,puesto>0?puesto:pe+pb+deuda);
  const bruto=pe+pb+ap;
  const idLiq=uid8();
  let resto=ap;
  const consumos=datos.consumos.map(c=>{
    if(c.empleadoId!==e.id||c.liquidado) return c;
    if(resto>=c.monto){ resto-=c.monto; return {...c,liquidado:true,liqId:idLiq}; }
    return c;
  });
  guardar({...datos,consumos,liquidaciones:[...datos.liquidaciones,
    {id:idLiq,fecha:hoy(),empleadoId:e.id,nombre:e.nombre,bruto,descontado:ap,neto:pe+pb,pagEfe:pe,pagBan:pb}]});
  panel.ls=panel.lpe=panel.lpb=undefined;
  listo(deuda>ap ? "Liquidado. Quedan "+$$(deuda-ap)+" pendientes." : "Liquidado. Cuenta en cero.");
}

function recalcPedido(){
  try{ recalcPedido_(); }catch(e){}
}
function recalcPedido_(){
  const pr=datos.proveedores.find(x=>x.id===panel.prov);
  const esPollo = pr.nombre.toLowerCase().indexOf("pollo")>=0;
  let monto;
  let h="";
  if(esPollo){
    const caj=cant(val("pc")), uni=num(val("pu")), otr=num(val("po"));
    const solopollo=caj*uni;
    monto=solopollo+otr;
    const kg=caj*datos.kgCajon;
    document.getElementById("pm").value=monto;
    if(caj) h+=fila("Pollo",$$(solopollo));
    if(otr) h+=fila("Otros productos",$$(otr));
    h+=fila("Total del pedido",$$(monto),true);
    if(caj) h+=fila("Kilos estimados",fmt(kg)+" kg ("+fmt(datos.kgCajon)+" por cajón)");
    if(kg) h+=fila("Costo por kilo de pollo",$$(solopollo/kg));
  } else {
    const det=(panel.det||[]).filter(d=>d.monto>0);
    if(det.length){
      const sumaDet=det.reduce((a,d)=>a+d.monto,0);
      if(!num(val("pm"))) document.getElementById("pm").value=sumaDet;
      monto=num(val("pm"))||sumaDet;
      h+=fila("Suma del detalle",$$(sumaDet));
      if(Math.abs(monto-sumaDet)>1) h+='<p class="tiny" style="margin-top:4px;color:#b91c1c">El detalle no llega al total. Falta cargar algún renglón.</p>';
    } else monto=num(val("pm"));
    h+=fila("Total del pedido",$$(monto),true);
  }
  const ant=panel.edit ? (datos.pedidos.find(x=>x.id===panel.edit)||{}) : {};
  const previa=deudaProv(pr) - ((ant.monto&&!ant.pagado) ? ant.monto : 0);
  const nuevoS=previa+(panel.pagado?0:monto);
  if(panel.pagado){
    const pe=num(val("pge")), pb=num(val("pgb")), falta=monto-pe-pb;
    if(pe) h+=fila("Sale de efectivo",$$(pe));
    if(pb) h+=fila("Sale de la cuenta bancaria",$$(pb));
    if(Math.abs(falta)>1){
      h+=fila(falta>0?"Falta asignar":"Asignaste de más",$$(Math.abs(falta)),true);
      h+='<p class="tiny" style="margin-top:6px;color:#b91c1c">Lo pagado tiene que sumar '+$$(monto)+'.</p>';
    } else h+=fila("Total pagado",$$(pe+pb),true);
    h+=fila("Deuda con "+pr.nombre,$$(previa));
  } else {
    h+=fila("Deuda antes",$$(previa))+fila("Deuda después",$$(nuevoS),true);
  }
  const inf=num(val("pi"));
  if(inf){
    const d=inf-nuevoS;
    h+=fila("Saldo informado",$$(inf))+fila("Diferencia",$$(d));
    if(Math.abs(d)>1) h+='<p class="tiny" style="margin-top:6px;color:#b91c1c">No coincide. Puede faltar cargar un pedido o un pago.</p>';
    else h+='<p class="tiny ok" style="margin-top:6px">Coincide con el proveedor.</p>';
  }
  document.getElementById("resPed").innerHTML=h;
}
function guardarPedido(){
  const pr=datos.proveedores.find(x=>x.id===panel.prov);
  const esPollo = pr.nombre.toLowerCase().indexOf("pollo")>=0;
  const m=num(val("pm"));
  if(m<=0) return notificar(esPollo?"Poné los cajones y el importe por cajón, o el importe de otros productos.":"Poné el total del pedido.");
  const reg={id:panel.edit||uid8(),fecha:val("pf"),provId:panel.prov,monto:m,informado:num(val("pi"))||null,pagado:!!panel.pagado,pagEfe:panel.pagado?num(val("pge")):0,pagBan:panel.pagado?num(val("pgb")):0};
  if(panel.pagado && Math.abs(reg.pagEfe+reg.pagBan-m)>1)
    return notificar("Lo pagado en efectivo y por banco tiene que sumar "+$$(m)+".");
  if(esPollo){ reg.cajones=cant(val("pc")); reg.unitario=num(val("pu")); reg.kg=reg.cajones*datos.kgCajon; reg.otros=num(val("po"))||0; reg.otrosNota=val("pn"); }
  else { const d=(panel.det||[]).filter(x=>x.monto>0||x.cant>0); if(d.length) reg.detalle=d; }
  const lista = panel.edit ? datos.pedidos.map(x=>x.id===panel.edit?reg:x) : [...datos.pedidos,reg];
  panel.det=null; panel.pagado=undefined;
  guardar({...datos,pedidos:lista});
  if(panel.edit){ listo("Pedido modificado."); return; }
  panel.det=[]; panel.pagado=undefined;
  render(); sigo("Pedido registrado. Podés cargar otro.");
}

function leerCopia(input){
  const f=input.files[0];

  const r=new FileReader();
  r.onload=()=>{
    let d;
    try { d=JSON.parse(r.result); } catch(e){ return notificar("Ese archivo no es una copia válida."); }
    if(!d.inicio||!d.cierres) return notificar("Ese archivo no parece una copia de esta app.");
    const resumen="Vas a reemplazar TODO lo que tenés hoy por la copia del archivo.\n\n"+
      "La copia trae:\n"+d.cierres.length+" días cerrados\n"+(d.gastos||[]).length+" gastos\n"+
      (d.empleados||[]).length+" empleados\n\nEsto no se puede deshacer. ¿Seguimos?";
    if(!confirm(resumen)) return;
    guardar(completar(d));
    panel=null;
    notificar("Copia restaurada.");
  };
  r.readAsText(f);
}

  h+='<div class="card"><h3 style="margin-bottom:8px">Retiros de ese día</h3>';

/* ---------- control semanal de carne ---------- */
function carneVendida(desde,hasta){
  const out={pechuga:0,patamuslo:0};
  datos.ventas.filter(v=>v.desde===desde).forEach(v=>v.items.forEach(i=>{
    const pd=datos.productos.find(x=>x.id===i.prodId);
    if(!pd||!pd.fam||!pd.fac) return;
    const kg=i.cant*pd.fac;
    if(pd.fam==="mezcla"){ out.pechuga+=kg/2; out.patamuslo+=kg/2; }
    else out[pd.fam]+=kg;
  }));
  return out;
}
function carneContada(items){
  const out={pechuga:0,patamuslo:0};
  (items||[]).forEach(i=>{
    const pd=datos.productos.find(x=>x.id===i.prodId);
    if(!pd||!pd.fam||!pd.fac) return;
    const kg=i.cant*pd.fac;
    if(pd.fam==="mezcla"){ out.pechuga+=kg/2; out.patamuslo+=kg/2; }
    else out[pd.fam]+=kg;
  });
  return out;
}

function filaControl(c){
  const da=new Date(c.desde+"T12:00:00"); da.setDate(da.getDate()-7);
  const ant=datos.conteos.find(x=>x.desde===iso(da));
  const cont=carneContada(c.items);
  const ven=carneVendida(c.desde,c.hasta);
  const ing=c.ingresos||{};
  if(!ant) return {c,cont,ven,ing,ini:null};
  return {c,cont,ven,ing,ini:carneContada(ant.items)};
}

/* ---------- reposición ---------- */
const PROV={
  ave:{n:"Ave (pollo, huevo, pan rallado)", dias:[1,2,3,4,5,6], cuando:"de lunes a sábado"},
  congelados:{n:"Congelados", dias:[2,4], cuando:"martes y jueves a las 9"},
  veggie:{n:"Burgers veggie", dias:[5], cuando:"viernes a la tarde"}
};
function proximas(diasSem, desde){
  const out=[]; const d=new Date(desde+"T12:00:00");
  for(let i=1;i<=21&&out.length<2;i++){
    d.setDate(d.getDate()+1);
    if(diasSem.indexOf(d.getDay())>=0) out.push({fecha:iso(d), dias:i});
  }
  return out;
}
function consumoDiario(){
  const sem=[...datos.ventas].sort((a,b)=>a.desde<b.desde?1:-1).slice(0,4);
  const out={}; 
  sem.forEach(v=>v.items.forEach(i=>{ out[i.prodId]=(out[i.prodId]||0)+i.cant; }));
  const dias=sem.length*7;
  Object.keys(out).forEach(k=>out[k]=dias?out[k]/dias:0);
  return {out, semanas:sem.length};
}
function vReposicion(){
  const {out:cons, semanas} = consumoDiario();
  const colchon = panel.colchon===undefined ? 1 : panel.colchon;
  panel.colchon = colchon;
  let h='<div class="card"><p class="tiny">Poné lo que hay en el local y la app calcula cuánto pedir. '+
    'El consumo sale de las últimas '+semanas+(semanas===1?' semana':' semanas')+' cargadas.</p>'+
    '<div class="row" style="margin-bottom:0"><label><span>Días de colchón</span>'+
    '<select onchange="panel.colchon=+this.value;render()">'+
    [0,1,2,3].map(x=>'<option value="'+x+'"'+(x===colchon?' selected':'')+'>'+x+'</option>').join("")+
    '</select></label><label></label></div></div>';

  if(!semanas) return h+'<div class="card"><p class="muted">Falta cargar al menos una semana de ventas por producto.</p></div>';

  Object.keys(PROV).forEach(k=>{
    const pv=PROV[k];
    const prods=datos.productos.filter(x=>x.activo&&x.prov===k&&(k!=="ave"||x.u==="kg"));
    if(!prods.length) return;
    const ent=proximas(pv.dias,hoy());
    const hastaD=(ent[1]?ent[1].dias:ent[0].dias)+colchon;
    h+='<div class="card"><h3 style="margin-bottom:4px">'+pv.n+'</h3>'+
      '<p class="tiny" style="margin-bottom:10px">Viene '+pv.cuando+'. Próxima entrega: '+fec(ent[0].fecha)+
      ' (en '+ent[0].dias+(ent[0].dias===1?' día':' días')+'). Lo que pidas tiene que durar '+hastaD+' días.</p>'+
      '<div class="detfila3"><span class="tiny">producto</span><span class="tiny">hay</span><span class="tiny">pedir</span></div>';
    prods.forEach(pd=>{
      const c=cons[pd.id]||0;
      h+='<div class="detfila3"><span>'+esc(pd.n)+'<br><span class="tiny">'+fmt(Math.round(c*100)/100)+' '+pd.u+' por día</span></span>'+
         '<input id="rp_'+pd.id+'" inputmode="decimal" placeholder="0" oninput="recalcRepo()">'+
         '<span class="tiny" id="rr_'+pd.id+'" data-c="'+c+'" data-d="'+hastaD+'" data-u="'+pd.u+'" data-urg="'+(ent[0].dias)+'">—</span></div>';
    });
    h+='</div>';
  });

  // pollo en cajones
  const kgProp=datos.productos.filter(x=>x.activo&&x.tipo==="propio"&&x.u==="kg"&&x.fam);
  const kgDia=kgProp.reduce((a,x)=>a+(cons[x.id]||0),0);
  const rend=0.785;
  const entA=proximas(PROV.ave.dias,hoy());
  const cobA=(entA[1]?entA[1].dias:entA[0].dias)+colchon;
  h+='<div class="card"><h3 style="margin-bottom:4px">Cajones de pollo</h3>'+
     '<div class="resumen">'+
     fila("Se venden por día",fmt(Math.round(kgDia*10)/10)+" kg de producto")+
     fila("Equivale a",fmt(Math.round(kgDia/rend*10)/10)+" kg de cajón")+
     fila("Para "+cobA+" días hacen falta",fmt(Math.ceil(kgDia/rend*cobA/datos.kgCajon))+" cajones",true)+
     '</div><p class="tiny" style="margin-top:8px">Calculado con un rendimiento de '+(rend*100).toFixed(0)+'% y '+fmt(datos.kgCajon)+' kg por cajón. Restale los cajones que ya tengas.</p></div>';
  return h;
}
function recalcRepo(){
  datos.productos.filter(x=>x.activo).forEach(pd=>{
    const inp=document.getElementById("rp_"+pd.id), out=document.getElementById("rr_"+pd.id);
    if(!inp||!out) return;
    const c=parseFloat(out.getAttribute("data-c"))||0;
    const d=parseFloat(out.getAttribute("data-d"))||0;
    const urg=parseFloat(out.getAttribute("data-urg"))||0;
    const u=out.getAttribute("data-u");
    const hay=cant(inp.value);
    const falta=Math.max(0, c*d-hay);
    const alcanza = c>0 ? hay/c : 99;
    out.innerHTML = (falta>0? fmt(Math.ceil(falta*100)/100)+" "+u : "no hace falta") +
      (c>0 && alcanza<urg ? '<br><span style="color:#b91c1c">alcanza '+fmt(Math.round(alcanza*10)/10)+' días: urgente</span>' : "");
  });
}

function finDeMes(ym){
  const y=+ym.slice(0,4), m=+ym.slice(5,7);

/* ---------- resultado del mes ---------- */
function resultadoMes(ym){
  const dm = datos.cierres.filter(c=>c.fecha.slice(0,7)===ym);
  const ventas = dm.reduce((a,c)=>a+c.efectivo+c.posnet,0);
  const consEmp = datos.consumos.filter(c=>c.tipo!=="adelanto"&&c.fecha.slice(0,7)===ym).reduce((a,c)=>a+c.monto,0);
  const peds = datos.pedidos.filter(x=>x.fecha.slice(0,7)===ym);
  const compras = peds.reduce((a,x)=>a+x.monto,0);
  const gs = datos.gastos.filter(g=>g.fecha.slice(0,7)===ym);
  const esProv = g => datos.proveedores.some(pr=>pr.nombre===g.categoria);
  const oper = gs.filter(g=>!esProv(g)&&g.categoria!==CAT_RETIRO&&g.categoria!==CAT_ESPECIE)
                 .reduce((a,g)=>a+g.monto,0);
  const especie = gs.filter(g=>g.categoria===CAT_ESPECIE).reduce((a,g)=>a+g.monto,0);
  const chicos = dm.reduce((a,c)=>a+Math.max(0,c.gastosChicos||0),0);
  const sueldos = datos.liquidaciones.filter(l=>l.fecha.slice(0,7)===ym).reduce((a,l)=>a+l.bruto,0);

  const idx = mesesInv(24).indexOf(ym);
  const invFin = invDe(ym), invIni = invDe(mesesInv(24)[idx+1]||"");
  const vFin = valorInv(invFin), vIni = valorInv(invIni);
  const consumo = (invIni&&invFin) ? vIni + compras - vFin - especie : null;
  const resultado = consumo===null ? null : ventas + consEmp - consumo - oper - chicos - sueldos;
  return {ventas,consEmp,compras,oper,chicos,sueldos,especie,vIni,vFin,consumo,resultado,invIni:!!invIni,invFin:!!invFin};
}

  });
  if(!ord.length) h+='<div class="card"><p class="muted">Todavía no cargaste ningún día.</p></div>';

  h+='<div class="card"><h3 style="margin-bottom:8px">Deuda que ya tenías con cada proveedor</h3>'+
    '<p class="muted" style="margin-bottom:12px">Lo que debías antes de empezar a usar la app. Se suma a los pedidos que cargues de acá en adelante.</p>'+
    datos.proveedores.map(pr=>'<div class="detfila2"><span>'+esc(pr.nombre)+'</span>'+
      '<input id="si_'+pr.id+'" inputmode="decimal" placeholder="0" value="'+(pr.saldoIni||"")+'"><span></span></div>').join("")+
    '<button class="btn2" style="margin-top:8px" onclick="guardarSaldosIni()">Guardar</button></div>';

  (function(){
    const e=equilibrio();
    h+='<div class="card"><h3 style="margin-bottom:8px">Punto de equilibrio</h3>';
    if(e.manual) h+='<p class="muted" style="margin-bottom:10px">Puesto a mano: '+$$(e.diario)+' por día.</p>';
    else if(!e.diario) h+='<p class="muted" style="margin-bottom:10px">'+esc(e.falta)+'</p>';
    else h+='<div class="resumen" style="margin-bottom:10px">'+
      fila("Sueldos",$$(e.sueldos))+
      fila("Cargas sociales"+(e.csEst?" (estimadas 54%)":""),$$(e.cs))+
      fila("Alquiler, servicios y otros",$$(e.otrosFijos))+
      fila("Gastos chicos del cajón",$$(e.chicos))+
      fila("Costos fijos del mes",$$(e.fijos),true)+
      fila("Margen de contribución",(e.mc*100).toFixed(1)+"%")+
      fila("Equilibrio mensual",$$(e.mensual))+
      fila("Equilibrio diario",$$(e.diario),true)+
      '</div><p class="tiny" style="margin-bottom:10px">Calculado con los datos de '+nombreMes(e.mes)+'. Se actualiza solo cada mes.</p>';
    h+='<div class="row" style="align-items:end"><label><span>Fijarlo a mano (opcional)</span><input id="eqm" inputmode="decimal" placeholder="0" value="'+(datos.equilibrioManual||"")+'"></label>'+
       '<button class="btn2" onclick="guardarEquilibrio()">Guardar</button></div>'+
       '<p class="tiny" style="margin-top:6px">Dejalo vacío para que lo calcule solo.</p></div>';
  })();

  h+='<div class="card"><h3 style="margin-bottom:8px">Kilos por cajón de pollo</h3>'+
    '<p class="muted" style="margin-bottom:12px">Se usa para estimar los kilos y el costo por kilo. Hoy: '+fmt(datos.kgCajon)+' kg.</p>'+
    '<div class="row"><label><span>Nuevo valor</span><input id="kgc" inputmode="decimal" placeholder="'+fmt(datos.kgCajon)+'"></label>'+
    '<button class="btn2" onclick="guardarKg()">Guardar</button></div></div>';

  h+='<div class="card"><h3 style="margin-bottom:8px">Copia de seguridad</h3>'+
    '<p class="muted" style="margin-bottom:12px">Bajá un archivo con todo lo cargado y guardalo en tu computadora o mandátelo por mail. Si algún día se pierde algo, lo restaurás desde ahí.</p>'+
    '<div class="row"><button class="btn2" onclick="bajarCopia()">Descargar copia</button>'+
    '<button class="btn2" onclick="pedirArchivo()">Restaurar copia</button></div>'+
    '<input type="file" id="archivo" accept="application/json,.json" style="display:none" onchange="leerCopia(this)">'+
    '</div>';

  h+='<div class="card"><h3 style="margin-bottom:8px">Arranque</h3><p class="muted">'+fec(datos.inicio.fecha)+
    ': caja chica '+$$(datos.inicio.cajaChica)+', efectivo '+$$(datos.inicio.cajaGrande)+', banco '+$$(datos.inicio.banco)+'.</p></div>';
  return h;
}
function preset(t){
  const d=new Date();
  if(t==="mes"){ panel.desde=ym(hoy())+"-01"; panel.hasta=hoy(); }
  else if(t==="ant"){
    const p=new Date(d.getFullYear(),d.getMonth()-1,1);
    const m=p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0");
    panel.desde=m+"-01"; panel.hasta=m+"-"+new Date(d.getFullYear(),d.getMonth(),0).getDate();
  } else {
    const todas=[].concat(
      datos.cierres.map(c=>c.fecha), datos.gastos.map(g=>g.fecha),
      datos.pedidos.map(x=>x.fecha), (datos.retiros||[]).map(r=>r.fecha),
      datos.traspasos.map(t=>t.fecha), datos.consumos.map(c=>c.fecha),
      datos.ventas.map(v=>v.desde), (datos.conteos||[]).map(c=>c.desde),
      HIST_DESDE?[HIST_DESDE]:[], [datos.inicio.fecha]
    ).filter(Boolean).sort();
    panel.desde=todas[0]; panel.hasta=hoy();
  }
  panel.txt=null; render();
}
function borrarCierre(f){ guardar({...datos,cierres:datos.cierres.filter(c=>c.fecha!==f)}); }
function armarResumen(){
  const d1=panel.desde,d2=panel.hasta, en=f=>f>=d1&&f<=d2;
  const vivos=cierresCalc().filter(c=>en(c.fecha));
  const fechasVivas=vivos.map(c=>c.fecha);
  const hs=HISTORICO.filter(r=>en(r.f)&&fechasVivas.indexOf(r.f)<0)
    .map(r=>({fecha:r.f,efectivo:r.e,posnet:r.p,consumo:r.c,retiro:null,quedo:null,banco:null,gastosChicos:0,difBanco:0,hist:true,
              po:r.po,co:r.co,ot:r.ot,su:r.su,cs:r.cs}));
  const cs=vivos.concat(hs).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const gs=datos.gastos.filter(g=>en(g.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const ts=datos.traspasos.filter(t=>en(t.fecha));
  const ls=datos.liquidaciones.filter(l=>en(l.fecha));
  const ms=datos.consumos.filter(c=>en(c.fecha));
  const s=calcular(datos);
  const ef=cs.reduce((a,c)=>a+c.efectivo,0), po=cs.reduce((a,c)=>a+c.posnet,0);
  const chicos=cs.reduce((a,c)=>a+Math.max(0,c.gastosChicos||0),0);
  const provPollo=datos.proveedores.find(pr=>pr.nombre.toLowerCase().indexOf("pollo")>=0);
  const peds=datos.pedidos.filter(x=>en(x.fecha));
  const pollo=peds.filter(x=>provPollo&&x.provId===provPollo.id);
  const kgPollo=pollo.reduce((a,x)=>a+(x.kg||0),0);
  const plataPollo=pollo.reduce((a,x)=>a+(x.monto-(x.otros||0)),0);
  const plataOtros=pollo.reduce((a,x)=>a+(x.otros||0),0);
  const cajones=pollo.reduce((a,x)=>a+(x.cajones||0),0);
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], pd={};
  cs.forEach(c=>{ const p=c.fecha.split("-").map(Number); const n=dias[new Date(p[0],p[1]-1,p[2]).getDay()];
    pd[n]=pd[n]||{t:0,n:0}; pd[n].t+=c.efectivo+c.posnet; pd[n].n++; });
  const pc={}; gs.forEach(g=>pc[g.categoria]=(pc[g.categoria]||0)+g.monto);

  const L=["GRANJA LOS ABUELOS — "+fecL(d1)+" al "+fecL(d2),
    (hs.length?"Incluye "+hs.length+" días de la planilla anterior (Excel) y "+vivos.length+" días cargados en la app.":"Días cargados en la app: "+vivos.length),
    "","VENTAS",
    "Días cargados: "+cs.length,"Total: "+$$(ef+po)+" (efectivo "+$$(ef)+", posnet "+$$(po)+")"];
  if(cs.length) L.push("Promedio diario: "+$$((ef+po)/cs.length));
  const cliT=cs.reduce((a,c)=>a+(c.clientes||0),0);
  const diasCli=cs.filter(c=>c.clientes).length;
  if(cliT){
    L.push("Clientes: "+fmt(cliT)+" en "+diasCli+" días | promedio "+fmt(cliT/diasCli)+" por día");
    const vCli=cs.filter(c=>c.clientes).reduce((a,c)=>a+c.efectivo+c.posnet,0);
    L.push("Ticket promedio: "+$$(vCli/cliT));
  }
  L.push("");
  if(Object.keys(pd).length){
    L.push("PROMEDIO POR DÍA DE SEMANA");
    Object.entries(pd).sort((a,b)=>b[1].t/b[1].n-a[1].t/a[1].n).forEach(([k,v])=>L.push(k+": "+$$(v.t/v.n)+" ("+v.n+" días)"));
    L.push("");
  }
  L.push("DETALLE DIARIO (fecha; efectivo; posnet; venta; clientes; ticket promedio; retiro; quedó; salió del cajón; faltante; saldo banco; sin acreditar)");
  cs.forEach(c=>L.push(c.hist
    ? [c.fecha,c.efectivo,c.posnet,c.efectivo+c.posnet,"-","-","-","-","-","-","-","-","planilla anterior"].join("; ")
    : [c.fecha,c.efectivo,c.posnet,c.efectivo+c.posnet,c.clientes||"-",c.clientes?Math.round((c.efectivo+c.posnet)/c.clientes):"-",c.retiro,c.quedo==null?"-":c.quedo,c.gastosChicos==null?"-":c.gastosChicos,c.faltante||0,c.banco==null?"-":c.banco,c.difBanco==null?"-":c.difBanco].join("; ")));
  L.push("","GASTOS CHICOS PAGADOS DEL CAJÓN: "+$$(chicos),"","GASTOS DE CAJA GRANDE Y CUENTA BANCARIA");
  if(!gs.length) L.push("Ninguno.");
  Object.entries(pc).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>L.push(k+": "+$$(v)));
  if(gs.length){
    L.push("Detalle (fecha; categoría; importe; origen):");
    gs.forEach(g=>L.push(g.fecha+"; "+g.categoria+(g.nota?" ("+g.nota+")":"")+"; "+g.monto+"; "+(g.origen==="efectivo"?"efectivo":"cuenta bancaria")));
  }
  if(hs.length){
    const g={POLLO:0,CONGELADOS:0,OTROS:0,SUELDOS:0,"CARGAS SOCIALES":0};
    hs.forEach(r=>{ g.POLLO+=r.po; g.CONGELADOS+=r.co; g.OTROS+=r.ot; g.SUELDOS+=r.su; g["CARGAS SOCIALES"]+=r.cs; });
    const consumoHist=hs.reduce((a,r)=>a+r.consumo,0);
    L.push("","GASTOS DE LA PLANILLA ANTERIOR ("+hs.length+" días)");
    Object.entries(g).forEach(([k,v])=>{ if(v) L.push(k+": "+$$(v)); });
    L.push("Consumo de empleados en esos días: "+$$(consumoHist));
    L.push("Detalle (fecha; pollo; congelados; otros; sueldos; cargas sociales):");
    hs.forEach(r=>{ if(r.po||r.co||r.ot||r.su||r.cs) L.push([r.fecha,r.po,r.co,r.ot,r.su,r.cs].join("; ")); });
  }
  /* ---- productos y kilos ---- */
  const semR=datos.ventas.filter(v=>!(v.hasta<d1||v.desde>d2));
  const vendR={}; semR.forEach(v=>v.items.forEach(i=>{ vendR[i.prodId]=(vendR[i.prodId]||0)+i.cant; }));
  const compR={}; peds.forEach(x=>(x.detalle||[]).forEach(dd=>{
    compR[dd.prodId]=compR[dd.prodId]||{cant:0,monto:0};
    compR[dd.prodId].cant+=dd.cant||0; compR[dd.prodId].monto+=dd.monto||0; }));

  L.push("","POLLO COMPRADO");
  L.push("Cajones: "+fmt(cajones)+" | kilos estimados: "+fmt(kgPollo)+" kg ("+fmt(datos.kgCajon)+" kg por cajón)");
  L.push("Plata en pollo: "+$$(plataPollo)+(plataOtros?" | otros productos del proveedor: "+$$(plataOtros):""));
  if(kgPollo) L.push("Costo por kilo: "+$$(plataPollo/kgPollo));

  if(semR.length){
    L.push("","VENTA POR PRODUCTO");
    L.push("Semanas incluidas: "+semR.map(v=>fec(v.desde)+" al "+fec(v.hasta)).join(", "));
    const conKg=(t)=>datos.productos.filter(pd=>pd.tipo===t&&(vendR[pd.id]||compR[pd.id]));
    const bloque=(t,titulo)=>{
      const f=conKg(t); if(!f.length) return;
      L.push("");
      L.push(titulo+" (producto; vendido; comprado; importe comprado; costo unitario)");
      let tk=0, tkCarne=0;
      f.forEach(pd=>{
        const c=compR[pd.id]||{cant:0,monto:0}, v=vendR[pd.id]||0;
        if(pd.u==="kg"){ tk+=v; if(pd.fam) tkCarne+=v; }   /* unidades y verduras no cuentan para el rendimiento */
        L.push(pd.n+"; "+fmt(v)+" "+pd.u+"; "+fmt(c.cant)+" "+pd.u+"; "+$$(c.monto)+"; "+(c.cant?$$(c.monto/c.cant):"-"));
      });
      L.push("Total vendido en kilos: "+fmt(tk)+" kg");
      if(t==="propio"&&tk!==tkCarne) L.push("De eso, sale del pollo: "+fmt(tkCarne)+" kg (el resto son productos de verdura)");
      return t==="propio"?tkCarne:tk;
    };
    const kgProp=bloque("propio","PRODUCTOS PROPIOS (salen del pollo)")||0;
    bloque("congelado","CONGELADOS COMPRADOS");
    if(kgPollo&&kgProp){
      L.push("");
      const rend=kgProp/kgPollo*100;
      L.push("RENDIMIENTO: "+fmt(kgProp)+" kg propios vendidos sobre "+fmt(kgPollo)+" kg de cajón = "+rend.toFixed(1)+"%");
      if(rend>100){
        L.push("OJO: no puede superar el 100%. Faltan cargar pedidos de pollo en este período.");
        L.push("Para vender "+fmt(kgProp)+" kg harían falta unos "+fmt(Math.ceil(kgProp/datos.kgCajon))+" cajones y cargaste "+fmt(cajones)+".");
      } else {
        L.push("Venta por kilo de cajón comprado: "+$$((ef+po)/kgPollo));
      }
    }
  } else {
    L.push("","VENTA POR PRODUCTO: no hay semanas cargadas en este período.");
  }

  const mesR=d2.slice(0,7);
  const rr=resultadoMes(mesR);
  L.push("","RESULTADO DE "+nombreMes(mesR).toUpperCase());
  if(rr.consumo===null) L.push("No calculable: faltan inventarios (inicio y cierre del mes).");
  else {
    L.push("Stock inicial: "+$$(rr.vIni)+" | compras: "+$$(rr.compras)+" | stock final: "+$$(rr.vFin));
    L.push("Mercadería consumida: "+$$(rr.consumo));
    L.push("Ventas: "+$$(rr.ventas)+" | sueldos: "+$$(rr.sueldos)+" | gastos operativos: "+$$(rr.oper)+" | gastos chicos: "+$$(rr.chicos));
    L.push("GANANCIA: "+$$(rr.resultado)+(rr.ventas?" | margen "+(rr.resultado/rr.ventas*100).toFixed(1)+"%":""));
  }
  /* ---- comparativo mes a mes ---- */
  const mesesDatos=[...new Set([].concat(
    datos.pedidos.map(x=>ym(x.fecha)), datos.ventas.map(v=>ym(v.hasta)),
    datos.cierres.map(c=>ym(c.fecha))))].sort();
  if(mesesDatos.length){
    L.push("","MES A MES (mes; cajones; kg comprados; $ pollo; costo x kg; kg propios vendidos; rendimiento; ventas)");
    mesesDatos.forEach(mm=>{
      const pe=datos.pedidos.filter(x=>ym(x.fecha)===mm&&provPollo&&x.provId===provPollo.id);
      const caj=pe.reduce((a,x)=>a+(x.cajones||0),0);
      const kgc=pe.reduce((a,x)=>a+(x.kg||0),0);
      const pl=pe.reduce((a,x)=>a+(x.monto-(x.otros||0)),0);
      let kgv=0;
      datos.ventas.filter(v=>ym(v.hasta)===mm).forEach(v=>v.items.forEach(i=>{
        const pd=datos.productos.find(x=>x.id===i.prodId);
        if(pd&&pd.tipo==="propio"&&pd.u==="kg"&&pd.fam) kgv+=i.cant;
      }));
      const vt=datos.cierres.filter(c=>ym(c.fecha)===mm).reduce((a,c)=>a+c.efectivo+c.posnet,0);
      L.push([nombreMes(mm), fmt(caj), fmt(kgc)+" kg", $$(pl), kgc?$$(pl/kgc):"-",
              fmt(kgv)+" kg", (kgc&&kgv)?(kgv/kgc*100).toFixed(1)+"%":"-", $$(vt)].join("; "));
    });
  }

  /* ---- control de carne ---- */
  const cts=datos.conteos.filter(c=>!(c.hasta<d1||c.desde>d2)).sort((a,b)=>a.desde<b.desde?-1:1);
  if(cts.length){
    L.push("","CONTROL DE CARNE (semana; familia; debería haber; contado; faltante)");
    cts.forEach(c=>{
      const da=new Date(c.desde+"T12:00:00"); da.setDate(da.getDate()-7);
      const ant=datos.conteos.find(x=>x.desde===iso(da));
      if(!ant) return;
      if(!c.items||!c.items.length){ L.push(fec(c.desde)+" al "+fec(c.hasta)+"; sin conteo cargado"); return; }
      const ini=carneContada(ant.items), ven=carneVendida(c.desde,c.hasta), cont=carneContada(c.items);
      ["pechuga","patamuslo"].forEach(f=>{
        const teo=ini[f]+((c.ingresos&&c.ingresos[f])||0)-ven[f];
        L.push(fec(c.desde)+" al "+fec(c.hasta)+"; "+FAMS[f]+"; "+fmt(teo)+" kg; "+fmt(cont[f])+" kg; "+fmt(teo-cont[f])+" kg");
      });
    });
  }

  L.push("","TRASPASOS");
  if(!ts.length) L.push("Ninguno.");
  ts.forEach(t=>L.push(t.fecha+"; "+(t.sentido==="be"?"banco a efectivo":"efectivo a banco")+"; "+t.monto+"; comisión "+(t.comision||0)));
  L.push("","EMPLEADOS");
  datos.empleados.forEach(e=>{
    const mi=ms.filter(c=>c.empleadoId===e.id);
    const con=mi.filter(c=>c.tipo!=="adelanto").reduce((a,c)=>a+c.monto,0);
    const ade=mi.filter(c=>c.tipo==="adelanto").reduce((a,c)=>a+c.monto,0);
    L.push(e.nombre+(e.activo?"":" (baja)")+": sueldo "+$$(e.sueldo+e.viaticos)+"; mercadería "+$$(con)+"; adelantos "+$$(ade)+"; pendiente hoy "+$$(saldoEmp(e.id)));
  });
  L.push("","LIQUIDACIONES");
  if(!ls.length) L.push("Ninguna.");
  ls.forEach(l=>L.push(l.fecha+"; "+l.nombre+"; bruto "+l.bruto+"; descontado "+l.descontado+"; pagado "+l.neto+"; efectivo "+pagoLiq(l).efe+"; banco "+pagoLiq(l).ban));
  const retP=datos.gastos.filter(g=>g.categoria===CAT_RETIRO&&en(g.fecha)).reduce((a,g)=>a+g.monto,0);
  const espP=datos.gastos.filter(g=>g.categoria===CAT_ESPECIE&&en(g.fecha)).reduce((a,g)=>a+g.monto,0);
  L.push("","RETIROS DE SOCIOS EN EL PERÍODO: "+$$(retP));
  L.push("RETIROS EN ESPECIE (mercadería, no movió plata): "+$$(espP));
  L.push("","DEUDA CON PROVEEDORES AL DÍA DE HOY");
  datos.proveedores.forEach(pr=>L.push(pr.nombre+": "+$$(deudaProv(pr))+(pr.saldoIni?" (incluye "+$$(pr.saldoIni)+" de deuda anterior)":"")));
  L.push("Total: "+$$(deudaTotal()));
  L.push("","SALDOS AL DÍA DE HOY","Efectivo: "+$$(s.cajaGrande),
    "Banco: "+$$(s.banco)+(s.bancoEst?" (estimado: faltan saldos reales desde el último cierre completo)":""),"Fondo fijo en el cajón: "+$$(s.cajaChica)+" (no cuenta como disponible)","Total disponible: "+$$(s.total),"Libre después de pagar proveedores: "+$$(s.total-deudaTotal()));
  panel.txt=L.join("\n");
  render();
}
function copiar(){
  navigator.clipboard.writeText(panel.txt).then(()=>notificar("Copiado. Pegalo en el chat."))
    .catch(()=>notificar("Seleccioná el texto y copialo a mano."));
}
function bajar(){
  const a=document.createElement("a");
  a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(panel.txt);
  a.download="granja-"+panel.desde+"-a-"+panel.hasta+".txt";
  a.click();
  notificar("Archivo descargado.");
}

iniciar();
</script>
